[build]
builder = "NIXPACKS"
# Deploy only on changes to what the SERVICE RUNS. A restart mid-position drops the
# in-process trail and the 1-second monitor until the container is back, and docs,
# tools and research pushes were restarting it: 9 of 19 deploys over 11 days were
# docs/tools-only, 12 of them with positions open.
#
# THIS LIVES UNDER [build]. From 2026-09-16 to 2026-09-24 it sat under [deploy], where
# Railway ignores it, so it never took effect: 34 pushes restarted the bot with a
# position open, and the daily audit's docs-only commit on 2026-09-24 18:30 still
# deployed (0a6f84af). Found by the 14-day review of shipped changes (wc/GRADE, C05).
#
# The list must cover everything the running service reads, or a real change would be
# SKIPPED: the package, the entry point, dependencies, the python version nixpacks
# reads, and the calibration seed the runtime loads at boot
# (FUTURES_CALIBRATION_FILE, default calibration/multi_symbol_calibration.json).
watchPatterns = [
  "futuresbot/**",
  "main.py",
  "requirements.txt",
  ".python-version",
  "calibration/**",
  "pytest.ini",
  "railway.toml",
]

[deploy]
startCommand = "python main.py"
requiredMountPath = "/data"
# ALWAYS, not ON_FAILURE: with a 5-retry budget a burst of exchange errors
# could exhaust it and leave the bot permanently dead with no signal. This is a
# daemon — any exit is a fault, and it should always come back.
restartPolicyType = "ALWAYS"
